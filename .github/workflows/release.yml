name: Release

# Builds a signed release APK and publishes it as a GitHub Release.
# Two ways to start it (signing secrets: see CLAUDE.md, "Releases"):
#  - Actions tab -> Release -> Run workflow on main, with a version like 1.0.0.
#    The workflow creates the tag v1.0.0 on that commit once the build succeeds.
#  - Push a tag like v1.0.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates the tag v1.0.0)"
        required: true

permissions:
  contents: write # create the tag and the GitHub Release

jobs:
  release:
    name: Signed APK and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Check version, tag and signing secrets
        env:
          INPUT_VERSION: ${{ inputs.version }}
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release workflow on main, not on $GITHUB_REF_NAME."
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists. Choose a new version."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (tag v1.2.3), got: $tag"
            exit 1
          fi
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret RELEASE_$name is missing. See CLAUDE.md, Releases."
              exit 1
            fi
          done
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Same checks as CI, in case the release commit skipped it.
      - name: Lint and unit tests
        run: ./gradlew --stacktrace ktlintCheck lintDebug testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          ./gradlew --stacktrace assembleRelease \
            -PappVersionName="${TAG#v}" \
            -PappVersionCode="$GITHUB_RUN_NUMBER"
          rm -f "$RELEASE_KEYSTORE_PATH"

      - name: Verify signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="rowerdisplay-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release made by hand on GitHub for this tag: just attach the APK.
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" \
              --title "Rower Display $TAG" \
              --generate-notes
          fi
