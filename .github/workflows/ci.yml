name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # push screenshots to the ci-screenshots branch
  pull-requests: write # post the screenshot comment

jobs:
  build:
    name: Lint, test, screenshots, APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew --stacktrace ktlintCheck lintDebug

      - name: Unit and screenshot tests
        if: always()
        run: ./gradlew --stacktrace testDebugUnitTest -Proborazzi.test.record=true

      - name: Build debug APK
        if: always()
        run: ./gradlew --stacktrace assembleDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Show screenshots in the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/publish-screenshots.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rowerdisplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
